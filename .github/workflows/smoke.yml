name: Endpoint smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily — catches upstream Liquipedia changes even without a push. Runs at
    # an odd minute rather than on the hour: GitHub queues scheduled jobs from
    # every repository at :00, and that stampede shares the same runner IP pool
    # Liquipedia rate-limits us by.
    - cron: '37 5 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SC2_WIKI_ROOT_URL: https://liquipedia.net/starcraft2
      LIQUIPEDIA_URL: https://liquipedia.net
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Liquipedia rate-limits per client IP and hosted runners share a pool of
      # datacenter IPs, so the run tries to borrow an IP of its own. A proxy you
      # control (SMOKE_HTTPS_PROXY) wins; otherwise pick a free one, rotating
      # daily. Both are best-effort — if nothing works this leaves HTTPS_PROXY
      # empty and the smoke run connects directly.
      - name: Select proxy for the smoke run
        continue-on-error: true
        env:
          SMOKE_HTTPS_PROXY: ${{ secrets.SMOKE_HTTPS_PROXY }}
        run: |
          proxy="$SMOKE_HTTPS_PROXY"
          if [ -n "$proxy" ]; then
            echo "using the SMOKE_HTTPS_PROXY secret"
          else
            proxy=$(./scripts/pick-liquipedia-proxy.sh)
          fi
          echo "HTTPS_PROXY=$proxy" >> "$GITHUB_ENV"

      - run: pnpm test:smoke
        env:
          # Liquipedia rate-limits per client IP, and hosted runners come from a
          # shared datacenter pool whose budget is often already spent by
          # unrelated traffic. Give the fetch layer a few minutes to ride that
          # out — far longer than the app's default, which has to fit inside a
          # serverless request.
          LIQUIPEDIA_RETRY_BUDGET_MS: '240000'
          # Makes Node's fetch honor the HTTPS_PROXY chosen above. An empty
          # value is a no-op, so this is safe when no proxy was found.
          NODE_OPTIONS: --use-env-proxy
